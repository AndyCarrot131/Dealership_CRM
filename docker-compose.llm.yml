services:
  local_llm:
    build: ./local_model/qwen3.5-4b-instruct
    container_name: dealer_crm_local_llm
    ports:
      - "8080:8080"
    gpus: all
    volumes:
      - ./local_model/qwen3.5-4b-instruct:/models:ro
    networks:
      - dealer_crm_net
    restart: unless-stopped

networks:
  dealer_crm_net:
    external: true
