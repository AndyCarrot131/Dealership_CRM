services:
  db:
    image: postgres:16
    container_name: dealer_crm_db
    environment:
      POSTGRES_DB: dealer_crm
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app -d dealer_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dealer_crm_net

  app:
    build:
      context: .
      dockerfile: Dockerfile.service
    container_name: dealer_crm_app
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_app:${DB_PASSWORD}@db:5432/dealer_crm
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8756:8756"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dealer_crm_net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  dealer_crm_net:
    external: true
