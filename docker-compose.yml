services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dealer_crm
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app -d dealer_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8756
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_app:${DB_PASSWORD}@db:5432/dealer_crm
      JWT_SECRET: ${JWT_SECRET}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8756:8756"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app

volumes:
  pgdata:
